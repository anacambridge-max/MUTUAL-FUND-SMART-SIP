name: Fix dashboard syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix callback closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/dashboard-service.ts')
          s=p.read_text()
          old='relStrengthVsNifty20D:relative,relStrengthVsNifty50D:relative}}).sort((a,b)=>b.finalScore-a.finalScore); }'
          new='relStrengthVsNifty20D:relative,relStrengthVsNifty50D:relative}}}).sort((a,b)=>b.finalScore-a.finalScore); }'
          if old not in s:
              raise SystemExit('target syntax pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          npm install
          npm run typecheck
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/dashboard-service.ts
          git commit -m 'fix: close opportunity scoring callback'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-syntax.yml
          git commit -m 'chore: remove one-time syntax fix workflow'
          git push
