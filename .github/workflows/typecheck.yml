name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fix opportunity engine
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/dashboard-service.ts')
          text = path.read_text()

          old = 'const classification: FundClassification = !usable ? "NEUTRAL" : move <= -1.5 ? "STRUCTURAL_BREAKDOWN" : move < -0.25 ? "HEALTHY_CORRECTION" : "NEUTRAL";'
          new = 'const classification: FundClassification = !usable ? "NEUTRAL" : move <= -2.5 ? "STRUCTURAL_BREAKDOWN" : move < -0.25 ? "HEALTHY_CORRECTION" : "NEUTRAL";'
          if old not in text:
              raise SystemExit('classification pattern not found')
          text = text.replace(old, new, 1)

          old = 'const finalScore = Math.round((strategic * runtimeSettings.strategicWeight / 100 + opportunity * runtimeSettings.opportunityWeight / 100) * 10) / 10;'
          new = '''const weaknessPriority = move !== null && move < -0.25
      ? Math.min(25, Math.max(0, (-move) * 12))
      : 0;
    const finalScore = Math.round((strategic * runtimeSettings.strategicWeight / 100 + opportunity * runtimeSettings.opportunityWeight / 100 + weaknessPriority) * 10) / 10;'''
          if old not in text:
              raise SystemExit('score pattern not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: npm run typecheck
      - name: Commit engine fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > .github/workflows/typecheck.yml <<'EOF'
          name: Typecheck

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            typecheck:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm install
                - run: npm run typecheck
          EOF
          git rm -f .github/workflows/fix-opportunity-engine.yml 2>/dev/null || true
          git add src/lib/dashboard-service.ts .github/workflows/typecheck.yml
          git commit -m 'fix: rank sector corrections as MF opportunities' || exit 0
          git push
      - run: true